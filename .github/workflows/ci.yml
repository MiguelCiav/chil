name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri & E2E)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node dependencies
        run: npm ci

      # 1. Lint with ESLint and Clippy
      - name: Run ESLint
        run: npm run lint

      - name: Run Cargo Clippy
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      # 2. Unit Testing with Vitest, Rust Native and SeaORM
      - name: Run Frontend Unit Tests (Vitest)
        run: npm run test

      - name: Run Backend Unit Tests (Cargo)
        run: |
          cd src-tauri
          cargo test

      - name: Build debug binary for E2E
        run: npm run tauri build -- --debug --no-bundle

      # 3. E2E Testing
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run E2E Tests
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          tauri-driver &
          sleep 5
          npx wdio run wdio.conf.ts

  build-and-release:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, macos-13, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      # 5. Semantic Release (Changesets)
      # Run only on Linux to avoid duplicate PRs
      - name: Create Release Pull Request or Publish
        if: matrix.platform == 'ubuntu-latest'
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build to compile Chil Installers (Tauri)
      # This action builds the app and creates a GitHub Release if the version changed.
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Chil v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
