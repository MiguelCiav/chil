# Unique project key for SonarQube
sonar.projectKey=MiguelCiav_chil
sonar.projectName=chil

# Organization key (required if using SonarCloud, e.g., sonar.organization=miguelciav)
sonar.organization=miguelciav

# Paths to source files
sonar.sources=src,functions,scraper-api

# Exclusions
sonar.exclusions=node_modules/**,dist/**,functions/node_modules/**,scraper-api/node_modules/**,.firebase/**,.vercel/**,coverage/**,**/__tests__/**,**/*.test.tsx,**/*.test.ts,**/*.test.js

# Paths to test files
sonar.tests=src,functions,scraper-api
sonar.test.inclusions=**/__tests__/**,**/*.test.tsx,**/*.test.ts,**/*.test.js

# Source encoding
sonar.sourceEncoding=UTF-8

# Coverage reports paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
